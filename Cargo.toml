[package]
name = "board"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["full"] }
yansi = { version = "1.0.1", features = ["detect-tty", "detect-env"] }
