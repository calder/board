[workspace]
members = ["vestaboard", "web"]

[package]
name = "board"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
vestaboard = { path = "vestaboard" }
yansi = { version = "1.0.1", features = ["detect-tty", "detect-env"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
