name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # build.rs runs `trunk build` for the server crate, which needs the wasm target.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - run: cargo fmt --check

      - run: cargo clippy --workspace --exclude web --all-targets -- -D warnings

      - run: cargo test --workspace --exclude web

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - run: cargo clippy -p web --all-targets --target wasm32-unknown-unknown -- -D warnings

      - run: trunk build
        working-directory: web

  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/tests/package-lock.json

      - run: cargo build --release

      - run: npm ci
        working-directory: web/tests

      - run: web/tests/docker.sh

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/tests/playwright-report
