name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # build.rs runs `trunk build` for the server crate, which needs the wasm target.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - run: cargo fmt --check

      - run: cargo clippy --workspace --exclude web --all-targets -- -D warnings

      - run: cargo test --workspace --exclude web

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - run: cargo clippy -p web --all-targets --target wasm32-unknown-unknown -- -D warnings

      - run: trunk build
        working-directory: web

  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    # The job runs inside the pinned image web/tests/run.sh uses, so screenshots match the
    # baselines.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      # The image has no C compiler, which Rust needs for linking.
      - run: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - run: cargo build --release

      - run: npm ci
        working-directory: web/tests

      - run: npx playwright test
        working-directory: web/tests

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/tests/playwright-report
